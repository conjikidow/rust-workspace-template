---
paths:
  '.github/workflows/release.yml':
    ignore:
      # shellcheck SC2086: Double quote to prevent globbing and word splitting
      - 'shellcheck reported issue in this script: SC2086:.*'

      # shellcheck SC2129: Consider using { cmd1; cmd2; } >> file
      - 'shellcheck reported issue in this script: SC2129:.*'

      # shellcheck SC2292: Prefer [[ ]] over [ ] for tests in Bash/Ksh
      - 'shellcheck reported issue in this script: SC2292:.*'

      # actionlint workflow-call: Reusable workflow calls with the self-repository syntax `$/`
      - 'reusable workflow call "\$/.*" at "uses" is not following the format.*'

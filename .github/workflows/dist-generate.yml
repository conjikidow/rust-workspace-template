name: Generate dist release.yml on Renovate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - dist-workspace.toml

permissions: {}

jobs:

  generate-workflow:
    name: Generate release.yml on Renovate PR
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true

      - name: Install dist
        run: |
          DIST_VERSION=$(grep -E '^\s*cargo-dist-version\s*=\s*"' dist-workspace.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "${DIST_VERSION}" ] || { echo "Failed to read cargo-dist-version from dist-workspace.toml"; exit 1; }
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: Run dist generate
        run: dist generate

      - name: Check for changes in release.yml
        id: diff
        run: |
          if git diff --quiet -- .github/workflows/release.yml; then
            echo "No changes in release.yml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git user
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit release.yml
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add .github/workflows/release.yml
          git commit -m "chore(deps): update dependency for release workflow" -m "Generated by dist generate."

      - name: Push back to PR branch
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: git push origin "HEAD:${PR_BRANCH}"

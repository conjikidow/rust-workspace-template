name: Regenerate release workflow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'dist-workspace.toml'

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  regenerate-release-workflow:
    name: Regenerate release workflow
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Check out the head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install dist
        run: |
          DIST_VERSION=$(sed -nE 's/^\s*cargo-dist-version\s*=\s*"([^"]+)".*/\1/p' dist-workspace.toml)
          [ -n "${DIST_VERSION}" ] || { echo "Failed to read cargo-dist-version from dist-workspace.toml"; exit 1; }
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: Generate release workflow
        run: dist generate

      - name: Detect release workflow changes
        id: release-workflow-changes
        run: |
          if git diff --quiet -- .github/workflows/release.yml; then
            echo "No changes in release.yml"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Git user
        if: steps.release-workflow-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit release workflow
        if: steps.release-workflow-changes.outputs.changed == 'true'
        run: |
          git add .github/workflows/release.yml
          git commit \
            --message="chore(deps): update dependency for release workflow" \
            --message="Generated by dist generate."

      - name: Push to the pull request branch
        if: steps.release-workflow-changes.outputs.changed == 'true'
        run: git push origin "HEAD:${GITHUB_HEAD_REF}"
